spring:
  application:
    name: backend

  # Postgres connection
  datasource:
    url: jdbc:postgresql://localhost:5432/babalegends
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  expiration: ${JWT_EXPIRATION}
  secret: ${JWT_SECRET}

# Image handler
app:
  storage:
    type: local
  upload-dir: ./uploads
  public-base-url: http://localhost:8080
  voting:
    window-hours: 48
    close-check-interval-ms: 600000
  cards:
    min-raters: 3
    learning-rate: 0.2

spring.application.name=backend
# Postgres connection
spring.datasource.url=jdbc:postgresql://localhost:5432/babalegends
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}

# Image handler
app.storage.type=local
app.upload-dir=./uploads
app.public-base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.voting.window-hours=48
app.voting.close-check-interval-ms=600000
app.cards.min-raters=3
app.cards.learning-rate=0.2
spring.flyway.repair=true